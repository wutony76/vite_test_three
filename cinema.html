<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 電影院選位</title>
  </head>
  <body>
    <!-- 3D 畫面的 canvas 會放進這裡 -->
    <div id="app"></div>

    <!-- 選位面板：一般 HTML，疊在 canvas 上方 -->
    <aside class="panel">
      <a class="back" href="/">← 回方塊練習</a>
      <h1>3D 電影院選位</h1>

      <ul class="legend">
        <li><i class="dot available"></i>可選</li>
        <li><i class="dot hover"></i>滑鼠指向</li>
        <li><i class="dot selected"></i>已選</li>
        <li><i class="dot sold"></i>已售出</li>
      </ul>

      <dl class="summary">
        <dt>已選座位</dt>
        <dd data-ref="seats">尚未選位</dd>
        <dt>總計</dt>
        <dd><strong data-ref="total">NT$ 0</strong></dd>
      </dl>

      <div class="actions">
        <button type="button" data-ref="clear">清除</button>
        <button type="button" data-ref="confirm" class="primary">確認訂位</button>
      </div>

      <p class="message" data-ref="message"></p>
    </aside>

    <script type="module" src="/src/cinema/main.ts"></script>
  </body>
</html>
