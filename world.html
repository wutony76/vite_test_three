<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORLD</title>
    <style>
      /* 清掉瀏覽器預設的 body margin（約 8px），少了它 canvas 周圍會有白邊、還會撐出捲軸 */
      html,
      body {
        margin: 0;
        padding: 0;
        /* 隱藏捲軸：全螢幕 3D 場景不需要捲動，canvas 若剛好等於視窗大小，小數像素誤差也可能冒出捲軸 */
        overflow: hidden;
      }
      /* 程式還沒跑起來之前先蓋住。顏色要跟 houseTransition.ts 的 CURTAIN_COLOR 一樣，接上畫布時才不會跳色 */
      #scene-cover {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #dae5e6;
        pointer-events: auto;
      }
      /* HUD：按鈕 = 可點的果凍 pill；標籤 = 指向房子的對話貼紙（兩套樣式分開） */
      :root {
        --world-ui-ink: #5a3d52;
      }

      .world-ui-actions {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 10px;
      }

      /* —— 按鈕「初視」「進入」：實心、光暈、可 hover —— */
      .world-ui-btn {
        position: relative;
        z-index: 2;
        margin: 0;
        padding: 12px 26px;
        border: 3px solid #fff;
        border-radius: 999px;
        cursor: pointer;
        overflow: hidden;
        isolation: isolate;
        color: #fff;
        font-family: "SF Pro Rounded", "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "PingFang TC", sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1.2;
        text-shadow: 0 1px 2px rgb(90 40 60 / 35%);
        background: linear-gradient(160deg, #ffb3cc 0%, #ff6b9d 45%, #f04f88 100%);
        box-shadow:
          0 0 0 2px rgb(255 120 160 / 50%),
          0 4px 0 #c93d72,
          0 14px 32px rgb(240 79 136 / 42%);
        transition:
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.22s ease,
          filter 0.22s ease;
      }

      .world-ui-btn::before {
        content: "";
        position: absolute;
        inset: 3px 10px auto;
        height: 40%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgb(255 255 255 / 55%) 0%, transparent 100%);
        pointer-events: none;
      }

      .world-ui-btn:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-3px) scale(1.03);
        box-shadow:
          0 0 0 3px rgb(255 160 190 / 55%),
          0 7px 0 #c93d72,
          0 18px 36px rgb(240 79 136 / 48%);
      }

      .world-ui-btn:active:not(:disabled) {
        transform: translateY(2px) scale(0.98);
        box-shadow:
          0 0 0 2px rgb(255 120 160 / 45%),
          0 1px 0 #c93d72,
          0 8px 20px rgb(240 79 136 / 35%);
      }

      .world-ui-btn:disabled {
        opacity: 0.5;
        cursor: wait;
        filter: saturate(0.65);
        transform: none;
      }

      .world-ui-btn--enter {
        background: linear-gradient(160deg, #b8f0e8 0%, #5ed4c6 45%, #3ebdb0 100%);
        box-shadow:
          0 0 0 2px rgb(94 212 198 / 50%),
          0 4px 0 #2a9a8f,
          0 14px 32px rgb(62 189 176 / 38%);
      }

      .world-ui-btn--enter:hover:not(:disabled) {
        box-shadow:
          0 0 0 3px rgb(120 230 215 / 55%),
          0 7px 0 #2a9a8f,
          0 18px 36px rgb(62 189 176 / 44%);
      }

      .world-ui-btn--enter:active:not(:disabled) {
        box-shadow:
          0 0 0 2px rgb(94 212 198 / 45%),
          0 1px 0 #2a9a8f,
          0 8px 20px rgb(62 189 176 / 32%);
      }

      .world-ui-enter-slot {
        position: relative;
        display: flex;
        align-items: flex-end;
      }

      .world-ui-enter-slot[hidden] {
        display: none;
      }

      /* 外層只負責置中與上下晃；旋轉放在圖上，才不會晃成左右擺 */
      .world-ui-enter-hint-wrap {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 16px);
        transform: translateX(-50%);
        pointer-events: none;
        user-select: none;
        animation: world-enter-hint-bob 1.15s ease-in-out infinite;
      }

      .world-ui-enter-hint {
        display: block;
        width: 54px;
        height: auto;
        transform: rotate(90deg);
        transform-origin: center center;
        filter: drop-shadow(0 2px 0 rgb(60 40 20 / 22%));
      }

      @keyframes world-enter-hint-bob {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }

        50% {
          transform: translateX(-50%) translateY(6px);
        }
      }

      .world-ui-enter-slot:has(.world-ui-btn--enter:disabled) .world-ui-enter-hint-wrap {
        opacity: 0.45;
        animation: none;
      }

      /* —— 房子名稱 tag：扁貼紙 + 指向下方的小尾巴，不搶按鈕 —— */
      .world-ui-chip {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        margin: 0;
        padding: 5px 12px 6px;
        border: 2px solid var(--world-ui-ink);
        border-radius: 10px;
        background: rgb(255 252 245 / 94%);
        color: var(--world-ui-ink);
        font-family: "PingFang TC", "Noto Sans TC", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.25;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 2px 0 rgb(90 61 82 / 18%);
      }

      .world-ui-chip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 10px;
        height: 10px;
        background: rgb(255 252 245 / 94%);
        border-right: 2px solid var(--world-ui-ink);
        border-bottom: 2px solid var(--world-ui-ink);
        transform: translateX(-50%) rotate(45deg);
        box-shadow: 2px 2px 0 rgb(90 61 82 / 12%);
      }
    </style>
  </head>
  <body>
    <div id="scene-cover" aria-hidden="true"></div>
    <div id="world-ui-actions" class="world-ui-actions" hidden>
      <button type="button" id="view-intro" class="world-ui-btn" aria-label="回到初視">
        初視
      </button>
      <div id="house-enter-slot" class="world-ui-enter-slot" hidden>
        <div class="world-ui-enter-hint-wrap" aria-hidden="true">
          <img
            class="world-ui-enter-hint"
            src="/ui/world-enter-hint.png"
            width="54"
            height="54"
            alt=""
          />
        </div>
        <button type="button" id="house-enter" class="world-ui-btn world-ui-btn--enter" aria-label="進入選中的房子">
          進入
        </button>
      </div>
    </div>
    <div id="app"></div>
    <!-- <script type="module" src="/src/learn/main.ts"></script> -->
    <script type="module" src="/src/world/main.ts"></script>
  </body>
</html>
