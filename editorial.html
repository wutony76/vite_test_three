<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="時尚雜誌風互動人像：虹膜跟隨滑鼠，Three.js 分層合成。"

    <meta name="theme-color" content="#f3efe8" />

  <body>
    <div class="editorial">
      <header class="editorial__mast">

          <p class="editorial__kicker">Fashion · Portrait · 01</p>

          <p class="editorial__meta">Interactive gaze · Three.js</p>

      <div class="editorial__stage-wrap">
        <div class="editorial__stage" data-ref="stage" aria-label="互動人像"></div>
