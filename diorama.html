<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="巷口烘焙 ALLEY ROAST：一間虛構的台南巷口咖啡店 3D 導覽。拖曳環顧，點擊物品看故事。" />
    <meta name="theme-color" content="#0b0f24" />
    <title>巷口烘焙｜3D 店面導覽</title>
  </head>
  <body>
    <div class="app" data-ref="app">
      <!-- 3D canvas -->
      <div class="stage" data-ref="stage"></div>

      <header class="title">
        <a class="title__back" href="/">← 練習首頁</a>
        <h1>巷口烘焙</h1>
        <p>ALLEY ROAST · since 2019 · 台南中西區</p>
      </header>

      <!-- 右上工具列；SVG 圖示直接寫在 HTML，不需要圖示套件 -->
      <nav class="toolbar" aria-label="場景控制">
        <button type="button" class="icon-btn" data-ref="home" aria-label="回到預設視角" title="回到預設視角">
          <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
        </button>
        <button type="button" class="icon-btn" data-ref="rain" aria-label="下雨" title="下雨" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8a3.5 3.5 0 0 1 0 7" /><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2" /></svg>
        </button>
        <button type="button" class="icon-btn" data-ref="sound" aria-label="環境音" title="環境音" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
        </button>
        <button type="button" class="icon-btn" data-ref="daynight" aria-label="切換白天" title="切換白天">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
        <button type="button" class="icon-btn" data-ref="listToggle" aria-label="導覽清單" title="導覽清單" aria-expanded="false" aria-controls="tour-list">
          <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" /><circle cx="4.5" cy="6" r="1" /><circle cx="4.5" cy="12" r="1" /><circle cx="4.5" cy="18" r="1" /></svg>
        </button>
      </nav>

      <!-- 導覽清單：鍵盤與螢幕閱讀器也能逐一瀏覽所有物品 -->
      <aside class="list" id="tour-list" data-ref="list" hidden>
        <h2>店裡有什麼</h2>
        <ol data-ref="listItems"></ol>
        <p class="list__note">虛構店家 · 所有模型、貼圖、聲音皆由程式產生</p>
      </aside>

      <!-- 滑鼠指向物品時的標籤 -->
      <div class="label" data-ref="label" aria-hidden="true" hidden></div>

      <!-- 物品介紹卡 -->
      <article class="card" data-ref="card" aria-live="polite" hidden>
        <button type="button" class="card__close" data-ref="cardClose" aria-label="關閉">×</button>
        <p class="card__index" data-ref="cardIndex"></p>
        <h2 data-ref="cardTitle"></h2>
        <p class="card__body" data-ref="cardBody"></p>
        <p class="card__meta" data-ref="cardMeta"></p>
        <div class="card__nav">
          <button type="button" data-ref="prev">‹ 上一個</button>
          <button type="button" data-ref="next">下一個 ›</button>
        </div>
      </article>

      <!-- 開場搭建進度 -->
      <div class="loader" data-ref="loader" role="status">
        <p data-ref="loaderText">搭建店面中…</p>
        <div class="loader__track"><div class="loader__bar" data-ref="loaderBar"></div></div>
      </div>

      <p class="hint" data-ref="hint">拖曳環顧 · 滾輪縮放 · 點擊物品看故事</p>

      <button type="button" class="icon-btn fullscreen" data-ref="fullscreen" aria-label="全螢幕" title="全螢幕">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>

      <div class="toast" data-ref="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/diorama/main.ts"></script>
  </body>
</html>
